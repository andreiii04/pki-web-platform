name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_DB: pki_db
      POSTGRES_USER: pki_user
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CA_KEYSTORE_PATH: ./secrets/ca-keystore.p12
      CA_KEY_ALIAS: pki-root-ca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Throwaway credentials, generated per run and never stored
      - name: Generate ephemeral secrets
        run: |
          for var in POSTGRES_PASSWORD CA_KEYSTORE_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done
          jwt="$(openssl rand -base64 64 | tr -d '\n')"
          aes="$(openssl rand -base64 32)"
          echo "::add-mask::$jwt"
          echo "::add-mask::$aes"
          echo "JWT_SECRET=$jwt" >> "$GITHUB_ENV"
          echo "AES_MASTER_KEY=$aes" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: |
          docker run -d --name pki-postgres -p 5432:5432 \
            -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec pki-postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" && exit 0
            sleep 2
          done
          exit 1

      - name: Generate Root CA
        working-directory: .
        run: ./scripts/generate-ca.sh

      - name: Build and test
        run: ./mvnw -B verify

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
