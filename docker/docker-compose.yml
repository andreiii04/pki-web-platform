services:
  postgres:
    image: postgres:16-alpine
    container_name: pki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pki_db}
      POSTGRES_USER: ${POSTGRES_USER:-pki_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - pki_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pki_user} -d ${POSTGRES_DB:-pki_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pki_pg_data:
    name: pki_pg_data
